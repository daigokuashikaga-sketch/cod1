[project]
name = "jarvis"
version = "0.1.0"
description = "A desktop-resident, screen-aware, voice-capable AI companion built on Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Reasoning / vision via the Anthropic API.
claude = ["anthropic>=0.40"]
# Screen capture + image downscaling.
screen = ["mss>=9.0", "Pillow>=10.0"]
# Local, free speech-to-text. Swap faster-whisper for whisper.cpp bindings on Apple Silicon.
stt = ["faster-whisper>=1.0", "silero-vad>=5.1", "openwakeword>=0.6", "sounddevice>=0.4"]
# Local, free text-to-speech.
tts = ["kokoro>=0.9", "soundfile>=0.12"]
# Semantic recall over the SQLite memory store.
vectors = ["numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
all = ["jarvis[claude,screen,stt,tts,vectors]"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["jarvis"]
mypy_path = "src"
ignore_missing_imports = true
